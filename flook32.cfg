#####################################################################
# FLOOK32 default config for AD5X
#####################################################################
# Existing installations keep their current flook32.cfg unchanged.

[flook32]

[temperature_sensor _flook32_chamber]
sensor_type: flook32
native_heater: True
native_heater_max_temp: 65
native_heater_wait_delta: 2

#####################################################################
# Optional local overrides
#####################################################################
# Files matching flook32.local*.cfg are ignored by Git and survive
# Moonraker/Z-Mod plugin updates. Repeating [flook32] or the hidden
# temperature-sensor section there overrides tracked defaults.
[include flook32.local*.cfg]
